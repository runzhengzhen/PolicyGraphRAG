[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-graphrag-workbench"
version = "0.2.0"
description = "Local-first policy graph analysis, evidence retrieval and research visualization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
graph = ["igraph>=0.11.8,<0.12"]
neo4j = ["neo4j>=5.26,<6"]
local-models = ["sentence-transformers>=2.7,<3"]

[project.scripts]
policygraph = "policygraph.cli:main"

[project.urls]
Repository = "https://github.com/runzhengzhen/PolicyGraphRAG"
Issues = "https://github.com/runzhengzhen/PolicyGraphRAG/issues"

[tool.setuptools.packages.find]
include = ["policygraph*"]

